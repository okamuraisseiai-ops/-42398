<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国語歌詞リーダー</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;max-width:760px;margin:auto;padding:20px 14px;background:Canvas;color:CanvasText}
h1{font-size:23px}textarea{width:100%;min-height:180px;font-size:17px;line-height:1.6;padding:12px;border:1px solid #999;border-radius:12px;background:Canvas;color:CanvasText}
button{cursor:pointer;border-radius:10px;padding:12px 18px;font-size:16px;border:1px solid #888;background:Canvas;color:CanvasText}
#convert{background:#2563eb;color:white;border:0;font-weight:700}#status{font-size:14px;min-height:24px;margin:12px 0}
.item{border-bottom:1px solid #8886;padding:18px 4px}.zh{font-size:25px;font-weight:700;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.py{font-size:17px;color:GrayText;margin-top:4px;overflow-wrap:anywhere}.ja{font-size:17px;margin-top:7px;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;gap:10px;align-items:start}
small{color:GrayText}#output{margin-top:12px}.play{font-size:14px;padding:6px 10px}
</style></head><body>
<h1>中国語歌詞リーダー 🎵</h1><p>歌詞を貼り付けて変換。<b>中国語 → 拼音 → 日本語</b> の順に1行ずつ表示します。</p>
<textarea id="lyrics" placeholder="中国語の歌詞をここに貼り付け"></textarea>
<p><button id="convert" type="button" onclick="window.startConversion()">変換する</button> <button type="button" onclick="window.clearLyrics()">クリア</button></p>
<div id="status" role="status">準備完了</div><div id="output"></div>
<p><small>ピンインには外部ライブラリ、日本語訳には外部翻訳サービスを使います。ネット接続が必要です。翻訳サービスがブラウザからのアクセスを拒否した場合、日本語訳は表示できません。</small></p>
<script>
(function(){
"use strict";
const el=id=>document.getElementById(id);
let generation=0, libPromise=null;
function status(t){el("status").textContent=t;}
function loadPinyin(){
 if(window.pinyinPro?.pinyin)return Promise.resolve(true);
 if(libPromise)return libPromise;
 libPromise=new Promise(resolve=>{
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.4/dist/index.js";
  const timer=setTimeout(()=>resolve(false),5000);
  s.onload=()=>{clearTimeout(timer);resolve(!!window.pinyinPro?.pinyin)};
  s.onerror=()=>{clearTimeout(timer);resolve(false)};
  document.head.appendChild(s);
 });
 return libPromise;
}
function linesFrom(t){return t.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean).slice(0,250);}
function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;}
function makeLine(zh){
 const item=node("section","item"),row=node("div","row"),left=node("div","");
 const cn=node("div","zh",zh),py=node("div","py","ピンインを取得中…"),ja=node("div","ja","日本語訳を取得中…");
 const speak=node("button","play","🔊");
 speak.type="button";speak.onclick=()=>{if(!("speechSynthesis" in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(zh);u.lang="zh-CN";u.rate=.85;speechSynthesis.speak(u);};
 left.append(cn,py,ja);row.append(left,speak);item.append(row);return {item,py,ja};
}
async function translate(zh){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6500);
 try{
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=ja&dt=t&q="+encodeURIComponent(zh);
  const r=await fetch(url,{signal:controller.signal});
  if(!r.ok)throw Error("HTTP "+r.status);
  const data=await r.json();
  const result=Array.isArray(data?.[0])?data[0].map(x=>x?.[0]||"").join("").trim():"";
  if(!result)throw Error("empty");
  return result;
 }finally{clearTimeout(timer);}
}
window.clearLyrics=function(){generation++;el("lyrics").value="";el("output").replaceChildren();status("準備完了");};
window.startConversion=async function(){
 const current=++generation,lines=linesFrom(el("lyrics").value),out=el("output");
 out.replaceChildren();
 if(!lines.length){status("歌詞を入力してください");return;}
 status("中国語を表示中…");
 const entries=[];
 const fragment=document.createDocumentFragment();
 for(const zh of lines){const e=makeLine(zh);entries.push({zh,...e});fragment.appendChild(e.item);}
 out.appendChild(fragment);
 status(lines.length+"行を表示しました。ピンイン・翻訳を取得中…");
 const loaded=await loadPinyin();
 if(current!==generation)return;
 for(let i=0;i<entries.length;i++){
  const e=entries[i];
  try{e.py.textContent=loaded?window.pinyinPro.pinyin(e.zh,{toneType:"symbol",type:"string"}):"ピンインを取得できません（通信を確認）";}
  catch{e.py.textContent="ピンインの変換に失敗しました";}
  if(i%15===0)await new Promise(r=>setTimeout(r,0));
 }
 let success=0;
 for(let i=0;i<entries.length;i++){
  if(current!==generation)return;
  const e=entries[i];
  try{e.ja.textContent=await translate(e.zh);success++;}
  catch{e.ja.textContent="日本語訳を取得できません（翻訳サービスへの接続失敗）";}
  status("翻訳 "+(i+1)+"/"+entries.length+"行 完了（成功 "+success+"行）");
  await new Promise(r=>setTimeout(r,80));
 }
};
})();
</script></body></html>
