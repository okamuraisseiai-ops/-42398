<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Chinese Reader</title>

  <!-- Pinyin conversion (runs in the browser) -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.4/dist/index.js"></script>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #171717;
      --sub: #62656d;
      --line: #e8e9ee;
      --accent: #111827;
      --error: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101114;
        --card: #191b20;
        --text: #f7f7f8;
        --sub: #a7aab2;
        --line: #2b2e35;
        --accent: #f7f7f8;
        --error: #ffb4ab;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
        "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    h1 {
      margin: 6px 0 4px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.6;
    }

    .input-card,
    .sentence-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.04);
    }

    .input-card {
      padding: 14px;
    }

    textarea {
      width: 100%;
      min-height: 175px;
      resize: vertical;
      border: 0;
      outline: 0;
      border-radius: 12px;
      padding: 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 17px;
      line-height: 1.65;
    }

    textarea::placeholder { color: var(--sub); }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      border-radius: 12px;
      min-height: 46px;
    }

    #convertBtn {
      flex: 1;
      background: var(--accent);
      color: var(--bg);
      padding: 0 18px;
    }

    #clearBtn {
      width: 92px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .status {
      min-height: 24px;
      padding: 10px 4px 0;
      color: var(--sub);
      font-size: 13px;
    }

    .status.error { color: var(--error); }

    .results {
      display: grid;
      gap: 13px;
      margin-top: 8px;
    }

    .sentence-card {
      position: relative;
      padding: 20px 54px 20px 20px;
    }

    .pinyin {
      margin-top: 5px;
      color: var(--sub);
      font-size: 17px;
      line-height: 1.55;
      letter-spacing: 0.01em;
      overflow-wrap: anywhere;
    }

    .chinese {
      margin-top: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei",
        -apple-system, sans-serif;
      font-size: 27px;
      font-weight: 750;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .japanese {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
    }

    .speak {
      position: absolute;
      right: 12px;
      top: 15px;
      width: 38px;
      min-height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      font-size: 18px;
    }

    .hint {
      margin: 18px 2px 0;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .chinese { font-size: 25px; }
      .pinyin { font-size: 16px; }
      .sentence-card { padding-left: 17px; padding-right: 50px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Chinese Reader</h1>
    <p class="lead">中国語の歌詞や文章を、1行ずつ「中国語 → ピンイン → 日本語」で読み解けます。</p>

    <section class="input-card">
      <textarea id="inputText" placeholder="例：
我喜欢你
今夜的月亮很美"></textarea>
      <div class="actions">
        <button id="convertBtn">変換する</button>
        <button id="clearBtn" type="button">クリア</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <p class="hint">
      ※ 改行ごとに1セット生成します（最大200行）。長い歌詞は先に中国語とピンインを表示し、翻訳が順次追加されます。ピンインは端末内で処理します。日本語訳には外部の翻訳サービスを使うため、ブラウザの通信制限やサービス変更で取得できない場合があります。歌詞は個人の学習目的で利用し、権利者の許可なく公開・再配布しないでください。
    </p>
  </main>

  <script>
    const input = document.getElementById("inputText");
    const convertBtn = document.getElementById("convertBtn");
    const clearBtn = document.getElementById("clearBtn");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    function setStatus(message = "", isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function splitChineseSentences(text) {
      // Lyrics: preserve each source line as its own unit.
      // Never split by sentence punctuation or combine separate lines.
      return text.replace(/\r/g, "").split("\n")
        .map(line => line.trim())
        .filter(Boolean)
        .slice(0, 200);
    }

    function toPinyin(text) {
      if (!window.pinyinPro?.pinyin) {
        throw new Error("ピンイン変換ライブラリを読み込めませんでした。");
      }

      return window.pinyinPro.pinyin(text, {
        toneType: "symbol",
        type: "string",
        nonZh: "consecutive"
      });
    }

    async function translateToJapanese(text) {
      // Personal-study MVP:
      // This endpoint does not require placing an API key in GitHub Pages.
      const url =
        "https://translate.googleapis.com/translate_a/single" +
        "?client=gtx&sl=zh-CN&tl=ja&dt=t&q=" +
        encodeURIComponent(text);

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 7000);
      let data;
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error("翻訳サービスの応答エラー");
        data = await response.json();
      } finally {
        clearTimeout(timeout);
      }

      const translated = Array.isArray(data?.[0])
        ? data[0]
            .map(part => Array.isArray(part) ? (part[0] || "") : "")
            .join("")
            .trim()
        : "";

      if (!translated) throw new Error("日本語訳を取得できませんでした。");
      return translated;
    }

    function speakChinese(text) {
      if (!("speechSynthesis" in window)) {
        setStatus("このブラウザでは読み上げ機能を利用できません。", true);
        return;
      }

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = 0.86;

      const voices = speechSynthesis.getVoices();
      const chineseVoice = voices.find(v =>
        /^zh(-|_)(CN|Hans)/i.test(v.lang)
      ) || voices.find(v => /^zh/i.test(v.lang));

      if (chineseVoice) utterance.voice = chineseVoice;

      speechSynthesis.speak(utterance);
    }

    function makeCard({ chinese, pinyin, japanese }) {
      const card = document.createElement("article");
      card.className = "sentence-card";

      const py = document.createElement("div");
      py.className = "pinyin";
      py.textContent = pinyin;

      const zh = document.createElement("div");
      zh.className = "chinese";
      zh.lang = "zh-CN";
      zh.textContent = chinese;

      const ja = document.createElement("div");
      ja.className = "japanese";
      ja.lang = "ja";
      ja.textContent = japanese;

      const speak = document.createElement("button");
      speak.className = "speak";
      speak.type = "button";
      speak.title = "中国語を読み上げる";
      speak.setAttribute("aria-label", "中国語を読み上げる");
      speak.textContent = "🔊";
      speak.addEventListener("click", () => speakChinese(chinese));

      card.append(zh, py, ja, speak);
      return card;
    }

    let currentRun = 0;
    async function convert() {
      const lines = splitChineseSentences(input.value);
      const run = ++currentRun;
      results.replaceChildren();
      setStatus("");

      if (!lines.length) {
        setStatus("中国語の歌詞を入力してね。", true);
        input.focus();
        return;
      }

      if (!window.pinyinPro?.pinyin) {
        setStatus("ピンイン用ライブラリが読み込めません。インターネット接続を確認してください。", true);
        return;
      }

      convertBtn.disabled = true;
      convertBtn.textContent = "変換中…";

      // All lines appear immediately; a failed translation never hides the Chinese text.
      const japaneseNodes = [];
      const fragment = document.createDocumentFragment();
      for (const chinese of lines) {
        let pinyin;
        try { pinyin = toPinyin(chinese); }
        catch (error) { pinyin = "ピンインを生成できませんでした"; }
        const card = makeCard({ chinese, pinyin, japanese: "翻訳中…" });
        japaneseNodes.push(card.querySelector(".japanese"));
        fragment.appendChild(card);
      }
      results.appendChild(fragment);
      setStatus(`${lines.length}行を表示しました。日本語訳を取得中（0/${lines.length}）…`);

      let nextIndex = 0;
      let done = 0;
      let failures = 0;
      async function worker() {
        while (nextIndex < lines.length && run === currentRun) {
          const index = nextIndex++;
          try {
            const translation = await translateToJapanese(lines[index]);
            if (run !== currentRun) return;
            japaneseNodes[index].textContent = translation;
          } catch (error) {
            if (run !== currentRun) return;
            japaneseNodes[index].textContent = "翻訳できませんでした（通信制限の可能性）";
            failures++;
          }
          done++;
          setStatus(`中国語・ピンインは表示済み｜日本語訳 ${done}/${lines.length}行${failures ? `（失敗 ${failures}行）` : ""}`, failures > 0);
        }
      }

      try {
        // Avoid dozens of requests hitting the translator at the same instant.
        await Promise.all(Array.from({ length: Math.min(2, lines.length) }, worker));
        if (run === currentRun) {
          setStatus(failures
            ? `完了：${lines.length}行表示。${failures}行の翻訳に失敗しました。翻訳サービスの制限が考えられます。`
            : `完了：${lines.length}行を変換しました。`, failures > 0);
        }
      } finally {
        if (run === currentRun) {
          convertBtn.disabled = false;
          convertBtn.textContent = "変換する";
        }
      }
    }

    convertBtn.addEventListener("click", convert);

    clearBtn.addEventListener("click", () => {
      currentRun++;
      input.value = "";
      results.replaceChildren();
      convertBtn.disabled = false;
      convertBtn.textContent = "変換する";
      setStatus("");
      speechSynthesis?.cancel?.();
      input.focus();
    });

    input.addEventListener("keydown", event => {
      // Cmd/Ctrl + Enter to convert.
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        convert();
      }
    });
  </script>
</body>
</html>
